name: Daily REST API Extraction Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC (6:00 AM) in Production
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment (dev | prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
      batch_date:
        description: 'Target extraction date (YYYY-MM-DD or yesterday)'
        required: false
        default: 'yesterday'
      upload_to_databricks:
        description: 'Upload directly to Databricks Unity Catalog Volume'
        required: false
        type: boolean
        default: true

jobs:
  extract-and-stage:
    name: Extract Previous-Day Records & Stage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests

      - name: Execute Daily Extraction
        id: extract
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          TARGET_ENV: ${{ github.event.inputs.target_env || (github.event_name == 'schedule' && 'prod' || 'dev') }}
          BATCH_DATE: ${{ github.event.inputs.batch_date || 'yesterday' }}
        run: |
          echo "Starting daily extraction for date: ${BATCH_DATE} in environment: ${TARGET_ENV}"
          python extract_api.py \
            --date "${BATCH_DATE}" \
            --env "${TARGET_ENV}" \
            --output-dir "./landing_data/api_orders" \
            --summary-file "metrics/latest_run_summary.json" \
            ${{ (github.event.inputs.upload_to_databricks == 'true' || github.event_name == 'schedule') && '--upload-to-volume' || '' }}

      - name: Update Upload Volume Tracker Dashboard
        run: |
          python update_tracker.py \
            --summary-file metrics/latest_run_summary.json \
            --history-file metrics/upload_history.json \
            --output-html upload_tracker.html \
            --run-id "${{ github.run_id }}" \
            --trigger-type "${{ github.event_name }}"

      - name: Upload Extracted JSON as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-extracted-orders-${{ github.event.inputs.target_env || (github.event_name == 'schedule' && 'prod' || 'dev') }}-${{ github.event.inputs.batch_date || 'yesterday' }}
          path: landing_data/api_orders/
          retention-days: 90
          if-no-files-found: warn

      - name: Commit and Push Updated Tracker Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html upload_tracker.html metrics/upload_history.json metrics/latest_run_summary.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(metrics): update daily upload volume tracker [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin ${{ github.ref_name }}
          else
            echo "No changes in tracker report to commit."
          fi
